name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install ncurses (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libncurses-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DBEANS_SANITIZERS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  format:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          if find src include tests -type f \( -name '*.c' -o -name '*.h' \) 2>/dev/null | head -1 | grep -q .; then
            sudo apt-get update && sudo apt-get install -y clang-format
            find src include tests -type f \( -name '*.c' -o -name '*.h' \) -print0 \
              | xargs -0 clang-format --dry-run --Werror
          else
            echo "No source files yet — skipping format check."
          fi
